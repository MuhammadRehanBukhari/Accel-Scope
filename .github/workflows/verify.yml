name: Verify AccelScope

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv verilator yosys g++ make
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Rebuild and verify both architectures
        run: .venv/bin/python scripts/rebuild.py
